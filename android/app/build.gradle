plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.meraj.jupyternotebook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meraj.jupyternotebook'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"

        buildPython("python")
        ndk {
    abiFilters "arm64-v8a", "armeabi-v7a"
        }

        pip {
            options("--timeout", "120", "--retries", "10")

            install("flask")
            install("waitress")
            install("numpy==1.23.3")
            install("pandas==2.1.3")
            install("scipy==1.8.1")
            install("matplotlib==3.6.0")
            install("seaborn==0.13.2")
            install("pillow==11.0.0")
            install("scikit-learn==1.3.2")
            install("joblib==1.4.2")
            install("mlxtend==0.23.4")
            install("threadpoolctl==3.5.0")
            install("statsmodels==0.14.5")
            install("sympy")
            install("networkx")
            install("openpyxl")
            install("xlsxwriter")
            install("xlrd")
            install("requests")
            install("aiohttp")
            install("fastapi")
            install("uvicorn")
            install("beautifulsoup4")
            install("cryptography")
            install("pyOpenSSL")
            install("dnspython")
            install("httpx")
            install("PyJWT")
            install("chardet")
            install("defusedxml")
            install("validators")
            install("filetype")
            install("python-dateutil")
            install("pytz")
            install("packaging")
            install("tqdm")

            // Missing library fix
            install("colorama")
        }
    }
}
