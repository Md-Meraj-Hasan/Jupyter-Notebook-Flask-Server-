<script>
/* Offline HTML/CSS tokenizers for the bundled CodeMirror 5 editor. */
(function(){
  if (!window.CodeMirror) return;
  CodeMirror.defineMode("bright-html", function(){
    return {token:function(stream){
      if(stream.match(/^\s+/)) return null;
      if(stream.match(/^<!--[\s\S]*?-->/)) return "comment";
      if(stream.match(/^<!--/)){ stream.skipToEnd(); return "comment"; }
      if(stream.match(/^<![^>]*>/)) return "meta";
      if(stream.match(/^<\/?/)){ stream.eatWhile(/[\w:-]/); return "tag"; }
      if(stream.match(/^\/>|^>/)) return "bracket";
      if(stream.match(/^[\w:-]+(?=\s*=)/)) return "attribute";
      if(stream.match(/^=/)) return "operator";
      if(stream.match(/^"[^\"]*"|^'[^']*'/)) return "string";
      if(stream.match(/^&[\w#]+;/)) return "atom";
      stream.next(); return null;
    }};
  });
  CodeMirror.defineMIME("text/html", "bright-html");
  CodeMirror.defineMode("css", function(){
    return {startState:function(){return {inComment:false,inString:null,inValue:false};}, token:function(stream,state){
      if(state.inComment){ if(stream.skipTo("*/")){stream.match("*/");state.inComment=false;}else stream.skipToEnd(); return "comment"; }
      if(state.inString){ while(!stream.eol()){var ch=stream.next(); if(ch===state.inString){state.inString=null;break;} if(ch==="\\") stream.next();} return "string"; }
      if(stream.eatSpace()) return null;
      if(stream.match("/*")){state.inComment=true;return "comment";}
      var ch=stream.peek();
      if(ch==='"'||ch==="'"){state.inString=stream.next();return "string";}
      if(stream.match(/^#[0-9a-fA-F]{3,8}\b/)) return "number";
      if(stream.match(/^[+-]?(?:\d*\.)?\d+(?:%|[a-zA-Z]+)?/)) return "number";
      if(stream.match(/^[\w-]+(?=\s*:)/)) return "property";
      if(stream.match(/^:[\w-]+/)) return "atom";
      if(stream.match(/^[.#][\w-]+/)) return "qualifier";
      if(stream.match(/^[\w-]+/)) return state.inValue ? "string-2" : "tag";
      if(stream.match(/[{}:;,()>+~]/)){if(stream.current()==="{")state.inValue=false;if(stream.current()===";")state.inValue=false;if(stream.current()==="{")return "bracket";if(stream.current()==="}")return "bracket";if(stream.current()===" :")state.inValue=true; if(stream.current()===" :")return "operator"; if(stream.current()===":")state.inValue=true; return "operator";}
      stream.next();return null;
    }};
  });
})();
</script>

        .coding-language-tab:focus-visible { outline: 1px dotted currentColor !important; outline-offset: -2px; }
</style>
</head>
<body>

<div class="menu-bar">
    <div class="dropdown">
        <div class="menu-item">📁 File</div>
        <div class="dropdown-content">
            <div onclick="newNotebook()">📄 New</div>
            <div onclick="openCurrentFile()">📂 Open</div>
            <div onclick="chooseNotebookDataFolder()">📁 Choose Data Folder (CSV)</div>
            <div onclick="saveCurrentFile(false)">💾 Save</div>
            <div onclick="saveCurrentFile(true)">📝 Save As</div>
        </div>
    </div>
    <div class="btn" style="margin-left:10px" onclick="toggleTheme()">🌙 Theme</div>
    <div class="dropdown mode-dropdown">
      <button class="mode-switch" id="mode-switch" onclick="toggleModeMenu(event)" title="Choose workspace">📒 Notebook ▾</button>
      <div class="dropdown-content mode-menu" id="mode-menu">
        <div onclick="selectWorkspace('notebook')">📒 Notebook</div>
        <div onclick="selectWorkspace('python')">🐍 Python</div>
        <div onclick="selectWorkspace('web')">🌐 HTML &amp; CSS</div>
      </div>
    </div>
    <button id="top-run-btn" onclick="runScript()" title="Run current code" aria-label="Run current code">▶ Run</button>
    <input type="file" id="file-input" accept=".ipynb,.json,.py,.html,.htm,.css,.csv,text/plain,text/html,application/json,application/x-ipynb+json" style="display:none" onchange="loadCurrentFile(event)">
</div>

<div class="container" id="notebook"></div>
<button class="fab-add" id="fab-btn" onclick="addNewCell()" title="Add Cell">+</button>
<div id="coding-page">
  <div class="coding-language-tabs" role="tablist" aria-label="Coding language">
    <button class="coding-language-tab active" id="lang-html" onclick="selectCodingLanguage('html')">HTML</button>
    <button class="coding-language-tab" id="lang-css" onclick="selectCodingLanguage('css')">CSS</button>
  </div>
  <div id="script-editor"><textarea id="script-code" placeholder="Write Python code here..."></textarea></div>
  <div id="web-editor" style="display:none"><textarea id="web-code"></textarea></div>
</div>

<div id="coding-output-page" aria-label="Python output page">
  <div class="output-page-toolbar">
    <button class="back-output-btn icon-btn" onclick="backToCodingEditor()" title="Back to code" aria-label="Back to code">Back</button>
    <span style="margin-left:auto"></span>
    <button class="icon-btn clear" onclick="clearConsole()" title="Clear output" aria-label="Clear output">Clear</button>
    <button class="icon-btn stop" onclick="cancelScript()" title="Stop Python" aria-label="Stop Python">Stop</button>
  </div>
  <iframe id="coding-web-preview" title="HTML and CSS output" sandbox="allow-forms allow-modals allow-popups"></iframe>
  <div id="console-terminal" role="log" aria-live="polite">
    <pre id="console-output"></pre>
    <div id="console-input-row"><span id="console-prompt"></span><input id="console-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Python input"></div>
  </div>
</div>

<div id="fixed-toolbar">
    <div class="symbol-row">
        <button class="symbol-btn prime-btn" onmousedown="event.preventDefault(); insertSymbol('\t');">TAB</button>
        <button class="symbol-btn prime-btn" onmousedown="event.preventDefault(); insertSymbol('=');">=</button>
        <button class="symbol-btn nav-btn" onmousedown="event.preventDefault(); moveCursor('up');">▲</button>
        <div class="scroll-area">
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('_');">_</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('\'\'');">' '</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('&quot;&quot;');">&quot; &quot;</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('()');">( )</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('[]');">[ ]</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('{}');">{ }</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol(':');">:</button>
        </div>
    </div>
    <div class="symbol-row">
        <button class="symbol-btn nav-btn" onmousedown="event.preventDefault(); moveCursor('left');">◀</button>
        <button class="symbol-btn nav-btn" onmousedown="event.preventDefault(); moveCursor('right');">▶</button>
        <button class="symbol-btn nav-btn" onmousedown="event.preventDefault(); moveCursor('down');">▼</button>
        <div class="scroll-area">
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('<');">&lt;</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('>');">&gt;</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('+');">+</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('-');">-</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('*');">*</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol('/');">/</button>
            <button class="symbol-btn" onmousedown="event.preventDefault(); insertSymbol(';');">;</button>
        </div>
    </div>
</div>

<script>
    let cellCount = 0;
    let editors = {};
    let lastFocusedEditor = null;
    const initialHeight = window.innerHeight;
    let currentMode = "notebook";
    let scriptEditor = null;
    let activeJobId = null;
    let statusPollTimer = null;
    let lastConsoleOutput = "";
    let currentWorkspace = "notebook";
    let currentFileName = "";

    window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });

    const syncToolbar = () => {
        const toolbar = document.getElementById('fixed-toolbar');
        const fab = document.getElementById('fab-btn');
        if (window.visualViewport) {
            const viewport = window.visualViewport;
            const isKeyboardOpen = viewport.height < initialHeight * 0.9;
            // Keep the original toolbar behavior in Notebook/Python/HTML/CSS.
            // The only added rule is to hide it while the dedicated output page is visible.
            const outputPage = document.getElementById('coding-output-page');
            if (document.body.classList.contains('terminal-open') ||
                (outputPage && getComputedStyle(outputPage).display !== 'none')) {
                toolbar.style.display = 'none';
                return;
            }
            if (isKeyboardOpen) {
                toolbar.style.display = 'flex';
                toolbar.style.top = (viewport.offsetTop + viewport.height - toolbar.offsetHeight) + 'px';
                fab.style.top = (viewport.offsetTop + viewport.height - toolbar.offsetHeight - 70) + 'px';
            } else {
                toolbar.style.display = 'none';
                fab.style.top = 'auto'; fab.style.bottom = '30px';
            }
        }
    };

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncToolbar);
        window.visualViewport.addEventListener('scroll', syncToolbar);
    }

    function addNewCell(content = "", language = "python") {
        cellCount++;
        const id = cellCount;
        const safeLanguage = ["python", "html", "css"].includes(language) ? language : "python";
        const html = `
            <div class="cell" id="cell-${id}" data-language="${safeLanguage}">
                <div class="toolbar">
                    <span class="cell-label">In [${id}]:</span>
                    <button class="btn-run" onclick="runCell(${id})">▶ Run</button>
                    <button class="btn-nav" onclick="moveCellUp(${id})">⬆️</button>
                    <button class="btn-nav" onclick="moveCellDown(${id})">⬇️</button>
                    <button class="btn" onclick="toggleOutput(${id})">👁️</button>
                    <button class="btn" onclick="deleteCell(${id})" style="margin-left:0;color:#cc0000">🗑</button>
                </div>
                <textarea id="code-${id}"></textarea>
                <div id="out-cont-${id}" class="output-container">
                    <button class="download-btn" onclick="downloadOutput(${id})" title="Download">⬇️</button>
                    <div id="output-${id}" class="output-area"></div>
                </div>
            </div>`;
        document.getElementById('notebook').insertAdjacentHTML('beforeend', html);
        const textarea = document.getElementById(`code-${id}`);
        textarea.value = content;
        const editor = CodeMirror.fromTextArea(textarea, {
            mode: safeLanguage === "python" ? "python" : (safeLanguage === "html" ? "text/html" : "css"),
            theme: document.body.classList.contains('night-mode') ? "material-darker" : "neo",
            lineNumbers: true, indentUnit: 4, matchBrackets: true, viewportMargin: Infinity
        });
        editor.on("focus", () => { lastFocusedEditor = editor; syncToolbar(); });
        editors[id] = editor;
    }

    function changeCellLanguage(id, language) {
        if (!["python", "html", "css"].includes(language)) language = "python";
        const cell = document.getElementById(`cell-${id}`);
        if (!cell || !editors[id]) return;
        cell.dataset.language = language;
        editors[id].setOption("mode", language === "python" ? "python" : (language === "html" ? "text/html" : "css"));
        const out = document.getElementById(`output-${id}`);
        if (out && out.querySelector("iframe")) out.innerHTML = "";
    }

    function getCellLanguage(id) {
        const cell = document.getElementById(`cell-${id}`);
        return cell && ["python", "html", "css"].includes(cell.dataset.language) ? cell.dataset.language : "python";
    }

    function escapePreviewText(value) {
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderWebPreview(targetId, htmlSource, cssSource, message) {
        const outputDiv = document.getElementById(`output-${targetId}`);
        const container = document.getElementById(`out-cont-${targetId}`);
        if (!outputDiv || !container) return;
        container.style.display = "block";
        outputDiv.innerHTML = `<div class="web-preview-caption">${escapePreviewText(message || "HTML/CSS Preview")}</div>`;
        const frame = document.createElement("iframe");
        frame.className = "web-preview-frame";
        frame.title = "HTML and CSS preview";
        frame.setAttribute("sandbox", "allow-forms allow-modals allow-popups");
        frame.setAttribute("referrerpolicy", "no-referrer");
        // Keep preview isolated from the notebook page; CSS is scoped to this iframe.
        const doc = String(htmlSource || "");
        const styleTag = `<style>html{box-sizing:border-box;min-height:100%;overflow-x:hidden;overflow-y:auto}body{box-sizing:border-box;min-height:100%;margin:8px;overflow-x:hidden;overflow-y:auto;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}*{max-width:100%;box-sizing:border-box;} ${String(cssSource || "")} </style>`;
        let rendered;
        if (/<html[\s>]/i.test(doc)) {
            rendered = /<head[\s>]/i.test(doc)
                ? doc.replace(/<head([^>]*)>/i, `<head$1>${styleTag}`)
                : doc.replace(/<html([^>]*)>/i, `<html$1><head>${styleTag}</head>`);
        } else {
            rendered = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">${styleTag}</head><body>${doc}</body></html>`;
        }
        frame.srcdoc = rendered;
        outputDiv.appendChild(frame);
    }

    function combinedCss() {
        return Object.keys(editors).map(Number).sort((a,b) => a-b)
            .filter(id => getCellLanguage(id) === "css")
            .map(id => editors[id].getValue()).join("\n\n");
    }

    function latestHtmlCell(excludeId = null) {
        const ids = Object.keys(editors).map(Number).sort((a,b) => a-b);
        for (let i = ids.length - 1; i >= 0; i--) {
            const id = ids[i];
            if (id !== excludeId && getCellLanguage(id) === "html" && editors[id].getValue().trim()) return id;
        }
        return null;
    }

    async function runCell(id) {
        const code = editors[id].getValue();
        const language = getCellLanguage(id);
        const outputDiv = document.getElementById(`output-${id}`);
        const container = document.getElementById(`out-cont-${id}`);
        container.style.display = "block";
        outputDiv.innerHTML = "";

        if (language === "html") {
            renderWebPreview(id, code, combinedCss(), "HTML Preview · CSS cells are applied");
            return;
        }
        if (language === "css") {
            const htmlId = latestHtmlCell(id);
            if (htmlId === null) {
                outputDiv.innerHTML = "<pre style='white-space:pre-wrap'>CSS saved. Add an HTML cell and run it to see this stylesheet applied.</pre>";
                return;
            }
            renderWebPreview(id, editors[htmlId].getValue(), combinedCss(), "HTML Preview · combined CSS stylesheets");
            return;
        }

        outputDiv.textContent = "Executing...";
        try {
            const response = await fetch('/run', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code: code })
            });
            const data = await response.json();
            let resultHtml = "";
            if ((data.output || "").trim() !== "") resultHtml += `<pre style="margin:0; white-space: pre-wrap;">${escapePreviewText(data.output)}</pre>`;
            if (data.html) resultHtml += `<div style="margin-top:10px;">${data.html}</div>`;
            if (data.final_val && data.final_val !== "None") {
                resultHtml += `<div style="margin-top:10px; border-top:1px dashed var(--border-color); padding-top:8px; display:flex; gap:10px;">
                               <span class="cell-label" style="font-size:14px;">Out [${id}]:</span>
                               <div style="flex-grow:1; white-space: pre-wrap;">${escapePreviewText(data.final_val)}</div></div>`;
            }
            outputDiv.innerHTML = resultHtml || "<span style='color:gray;'>Executed</span>";
        } catch (err) { outputDiv.textContent = "Error: " + err; }
    }

    // FIXED: Full Scroll Width Capture Logic
    function downloadOutput(id) {
        const outputElement = document.getElementById(`output-${id}`);
        const container = document.getElementById(`out-cont-${id}`);
        
        // Temporarily allow overflow to measure full width
        const originalWidth = outputElement.style.width;
        const originalScrollLeft = container.scrollLeft;
        
        html2canvas(outputElement, {
            backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg-body'),
            scale: 2,
            scrollX: 0,
            scrollY: 0,
            width: outputElement.scrollWidth, // Captures full width
            height: outputElement.scrollHeight,
            useCORS: true,
            logging: false
        }).then(canvas => {
            const dataUrl = canvas.toDataURL("image/png");
            const base64 = dataUrl.substring(dataUrl.indexOf(",") + 1);
            if (window.AndroidDownloads && typeof window.AndroidDownloads.saveBase64File === "function") {
                window.AndroidDownloads.saveBase64File(`cell-${id}-analysis.png`, "image/png", base64);
            } else {
                const link = document.createElement("a");
                link.download = `cell-${id}-analysis.png`;
                link.href = dataUrl;
                link.click();
            }
            container.scrollLeft = originalScrollLeft; // Restore scroll position
        }).catch(err => alert("Could not create output image: " + err));
    }

    function insertSymbol(sym) {
        if (!lastFocusedEditor) return;
        const doc = lastFocusedEditor.getDoc();
        const cursor = doc.getCursor();
        doc.replaceRange(sym, cursor);
        lastFocusedEditor.focus();
        if (['()', '[]', '{}', '""', "''"].includes(sym)) doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
    }

    function moveCursor(dir) {
        if (!lastFocusedEditor) return;
        lastFocusedEditor.focus();
        if (dir === 'up') lastFocusedEditor.execCommand("goLineUp");
        else if (dir === 'down') lastFocusedEditor.execCommand("goLineDown");
        else if (dir === 'left') lastFocusedEditor.execCommand("goCharLeft");
        else if (dir === 'right') lastFocusedEditor.execCommand("goCharRight");
    }

    function toggleTheme() {
        document.body.classList.toggle('night-mode');
        const isNight = document.body.classList.contains('night-mode');
        Object.values(editors).forEach(ed => ed.setOption("theme", isNight ? "material-darker" : "neo"));
        if (scriptEditor) scriptEditor.setOption("theme", isNight ? "material-darker" : "neo");
        localStorage.setItem('theme', isNight ? 'night' : 'light');
    }

    function toggleOutput(id) {
        const cont = document.getElementById(`out-cont-${id}`);
        cont.style.display = cont.style.display === "none" ? "block" : "none";
    }

    function deleteCell(id) { if(confirm("Delete?")) { document.getElementById(`cell-${id}`).remove(); delete editors[id]; } }
    
    function newNotebook() { if(confirm("Clear?")) { document.getElementById('notebook').innerHTML = ""; cellCount = 0; editors = {}; addNewCell(); } }

    function openCurrentFile() {
        const input = document.getElementById('file-input');
        const workspace = currentWorkspace;
        input.dataset.openWorkspace = workspace;
        input.accept = workspace === 'python' ? '.py,text/x-python,text/plain' : (workspace === 'web' ? '.html,.htm,.css,text/html,text/css,text/plain' : '.ipynb,.json,application/json,application/x-ipynb+json,text/plain');
        input.value = '';
        input.click();
    }

    function chooseNotebookDataFolder() {
        if (window.AndroidDownloads && typeof window.AndroidDownloads.chooseDataFolder === 'function') {
            window.AndroidDownloads.chooseDataFolder();
        } else {
            alert('Folder selection is available in the Android app.');
        }
    }

    function downloadTextFile(filename, mime, text) {
        if (window.AndroidDownloads && typeof window.AndroidDownloads.saveBase64File === "function") {
            const base64 = btoa(unescape(encodeURIComponent(text)));
            const saveKey = currentWorkspace + ':' + (currentWorkspace === 'web' ? codingLanguage : 'main') + ':' + filename;
            window.AndroidDownloads.saveBase64File(filename, mime, base64, !!window.__saveAsRequested, saveKey);
            window.__saveAsRequested = false;
        } else {
            window.__saveAsRequested = false;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([text], {type:mime}));
            a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
    }

    function saveCurrentFile(saveAs) {
        // Only Save As forces a new destination. Ordinary Save reuses the last URI saved by Android.
        window.__saveAsRequested = !!saveAs;
        let defaultName = currentFileName;
        let extension = '.ipynb', mime = 'application/x-ipynb+json', content = '';
        if (currentWorkspace === 'python') {
            extension = '.py'; mime = 'text/x-python';
            content = scriptEditor ? scriptEditor.getValue() : document.getElementById('script-code').value;
            defaultName = defaultName || 'script.py';
        } else if (currentWorkspace === 'web') {
            if (codingLanguage === 'css') {
                extension = '.css'; mime = 'text/css';
                content = webEditor ? webEditor.getValue() : savedCssCode;
                defaultName = defaultName || 'style.css';
            } else {
                extension = '.html'; mime = 'text/html';
                content = webEditor ? webEditor.getValue() : savedHtmlCode;
                defaultName = defaultName || 'index.html';
            }
        } else {
            const cells = Object.entries(editors).map(([idText, ed]) => ({
                cell_type: 'code', execution_count: null,
                metadata: {custom_language: getCellLanguage(Number(idText))}, outputs: [],
                source: ed.getValue().split('\n').map((line, i, all) => i < all.length - 1 ? line + '\n' : line)
            }));
            content = JSON.stringify({cells, metadata:{kernelspec:{display_name:'Python 3',language:'python',name:'python3'},language_info:{name:'python',file_extension:'.py',mimetype:'text/x-python'}},nbformat:4,nbformat_minor:5}, null, 2);
            defaultName = defaultName || 'notebook.ipynb';
        }
        // Keep the filename suggestion aligned with the active workspace. A previous
        // style.css/index.html name must not leak into Notebook Save As (or vice versa).
        const activeDefaultName = defaultName && defaultName.toLowerCase().endsWith(extension)
            ? defaultName : (currentWorkspace === 'notebook' ? 'notebook.ipynb'
                : currentWorkspace === 'python' ? 'script.py'
                : (codingLanguage === 'css' ? 'style.css' : 'index.html'));
        let filename = (currentFileName && currentFileName.toLowerCase().endsWith(extension))
            ? currentFileName : activeDefaultName;
        if (saveAs || !currentFileName || !currentFileName.toLowerCase().endsWith(extension)) {
            const suggested = activeDefaultName;
            filename = prompt('Save file name (extension will be kept appropriate):', suggested);
            if (!filename) return;
            filename = filename.trim();
            if (!filename) return;
            // Ensure mode-specific extension; replace a conflicting extension rather than append twice.
            filename = filename.replace(/\.(ipynb|json|py|html?|css)$/i, '');
            filename += extension;
        } else if (!filename.toLowerCase().endsWith(extension)) {
            filename = filename.replace(/\.[^.]+$/, '') + extension;
        }
        currentFileName = filename;
        downloadTextFile(filename, mime, content);
    }

    // Keep compatibility with the old File menu callback.
    function saveToFile() { saveCurrentFile(false); }

    window.onNativeDownloadResult = function(success, message) {
        if (success) alert(message || "File saved successfully");
        else if (message && message !== "Save cancelled") alert(message);
    };
    
    function loadCurrentFile(event) {
        const input = event.target;
        const file = input.files && input.files[0];
        if (!file) return;
        const name = file.name || '';
        const ext = name.toLowerCase().split('.').pop();
        const reader = new FileReader();
        reader.onload = (e) => {
            const text = String(e.target.result || '');
            try {
                if (['py'].includes(ext)) {
                    selectWorkspace('python');
                    if (!scriptEditor) selectWorkspace('python');
                    if (scriptEditor) scriptEditor.setValue(text);
                    else document.getElementById('script-code').value = text;
                } else if (['html','htm'].includes(ext)) {
                    selectWorkspace('web'); selectCodingLanguage('html');
                    savedHtmlCode = text;
                    if (webEditor) webEditor.setValue(text);
                } else if (ext === 'css') {
                    selectWorkspace('web'); selectCodingLanguage('css');
                    savedCssCode = text;
                    if (webEditor) webEditor.setValue(text);
                } else {
                    const parsed = JSON.parse(text);
                    let cellsToLoad;
                    if (Array.isArray(parsed) && parsed.every(c => typeof c === 'string')) {
                        cellsToLoad = parsed.map(source => ({source, language:'python'}));
                    } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.cells)) {
                        // Accept standard Jupyter .ipynb cells as well as this app's JSON notebook.
                        cellsToLoad = parsed.cells.filter(c => c && (!c.cell_type || c.cell_type === 'code')).map(cell => ({
                            source: Array.isArray(cell.source) ? cell.source.join('') : (typeof cell.source === 'string' ? cell.source : ''),
                            language: cell.metadata && ['python','html','css'].includes(cell.metadata.custom_language) ? cell.metadata.custom_language : 'python'
                        }));
                    } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.worksheets)) {
                        // Legacy notebook JSON shape: accept cell-like source entries when present.
                        cellsToLoad = parsed.worksheets.flatMap(sheet => Array.isArray(sheet.cells) ? sheet.cells : []).map(cell => ({
                            source: Array.isArray(cell.source) ? cell.source.join('') : (typeof cell.source === 'string' ? cell.source : ''), language: 'python'
                        }));
                    } else throw new Error('Unsupported JSON. Notebook JSON must contain a cells array.');
                    document.getElementById('notebook').innerHTML = '';
                    cellCount = 0; editors = {};
                    cellsToLoad.forEach(cell => addNewCell(cell.source, cell.language));
                    if (!cellsToLoad.length) addNewCell();
                    selectWorkspace('notebook');
                }
                currentFileName = name;
            } catch (err) {
                alert('Could not open file: ' + (err.message || 'Invalid file'));
            } finally { input.value = ''; }
        };
        reader.onerror = () => { alert('Could not read selected file.'); input.value = ''; };
        reader.readAsText(file);
    }
    function loadFromFile(event) { loadCurrentFile(event); }

    function moveCellUp(id) {
        const cell = document.getElementById(`cell-${id}`);
        if (cell.previousElementSibling) { cell.parentNode.insertBefore(cell, cell.previousElementSibling); editors[id].refresh(); }
    }

    function moveCellDown(id) {
        const cell = document.getElementById(`cell-${id}`);
        if (cell.nextElementSibling) { cell.parentNode.insertBefore(cell.nextElementSibling, cell); editors[id].refresh(); }
    }


    let codingLanguage = "python";
    let webEditor = null;
    let savedHtmlCode = "";
    let savedCssCode = "";

    function selectCodingLanguage(language) {
        if (!["python", "html", "css"].includes(language)) language = "python";
        if (codingLanguage === "html" && webEditor) savedHtmlCode = webEditor.getValue();
        if (codingLanguage === "css" && webEditor) savedCssCode = webEditor.getValue();
        codingLanguage = language;
        const htmlTab = document.getElementById("lang-html");
        const cssTab = document.getElementById("lang-css");
        if (htmlTab) htmlTab.classList.toggle("active", language === "html");
        if (cssTab) cssTab.classList.toggle("active", language === "css");
        document.getElementById("script-editor").style.display = language === "python" ? "block" : "none";
        document.getElementById("web-editor").style.display = language === "python" ? "none" : "block";
        document.getElementById("top-run-btn").title = language === "python" ? "Run Python code" : (language === "html" ? "Preview HTML with CSS" : "Preview HTML with CSS");
        if (language !== "python" && !webEditor) {
            webEditor = CodeMirror.fromTextArea(document.getElementById("web-code"), {
                mode: "text/html", theme: document.body.classList.contains("night-mode") ? "material-darker" : "neo",
                lineNumbers: true, indentUnit: 2, matchBrackets: true, viewportMargin: Infinity
            });
            webEditor.on('focus', () => { lastFocusedEditor = webEditor; syncToolbar(); });
            webEditor.on('mousedown', () => { lastFocusedEditor = webEditor; });
            webEditor.on('keyup', () => { lastFocusedEditor = webEditor; });
        }
        if (webEditor) {
            if (language !== 'python') lastFocusedEditor = webEditor;
            webEditor.setOption("mode", language === "html" ? "text/html" : "css");
            webEditor.setValue(language === "html" ? savedHtmlCode : savedCssCode);
            webEditor.setSize("100%", "auto");
            setTimeout(() => webEditor.refresh(), 50);
        }
        if (scriptEditor) setTimeout(() => scriptEditor.refresh(), 50);
    }

    function showWebOutputPage() {
        document.getElementById("coding-page").style.display = "none";
        document.getElementById("coding-output-page").style.display = "block";
        document.getElementById("coding-output-page").classList.add("web-output");
        document.body.classList.add("terminal-open");
        document.getElementById("console-output").textContent = "";
        document.getElementById("console-input-row").style.display = "none";
        const html = savedHtmlCode;
        const css = savedCssCode;
        const style = `<style>
          html { touch-action: pan-y; box-sizing:border-box; min-height:100%; overflow-x:hidden; overflow-y:auto; }
          body { touch-action: pan-y; box-sizing:border-box; min-height:100%; margin:8px; overflow-x:hidden; overflow-y:auto; overflow-wrap:anywhere; -webkit-overflow-scrolling:touch; }
          *, *::before, *::after { max-width:100%; box-sizing:border-box; }
          img, video, iframe, table { max-width:100%; }
          ${css}
        </style>`;
        let rendered;
        if (/<html[\s>]/i.test(html)) {
            rendered = /<head[\s>]/i.test(html) ? html.replace(/<head([^>]*)>/i, `<head$1><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">${style}`) : html.replace(/<html([^>]*)>/i, `<html$1><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">${style}</head>`);
        } else {
            rendered = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">${style}</head><body>${html}</body></html>`;
        }
        document.getElementById("coding-web-preview").srcdoc = rendered;
        window.scrollTo(0, 0);
    }

    function toggleModeMenu(event) {
        if (event) event.stopPropagation();
        const menu = document.getElementById('mode-menu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
        const menu = document.getElementById('mode-menu');
        if (menu && !event.target.closest('.mode-dropdown')) menu.style.display = 'none';
    });

    function selectWorkspace(workspace) {
        if (!['notebook','python','web'].includes(workspace)) workspace = 'notebook';
        currentWorkspace = workspace;
        currentMode = workspace === 'notebook' ? 'notebook' : 'coding';
        document.getElementById('mode-menu').style.display = 'none';
        document.getElementById('notebook').style.display = workspace === 'notebook' ? 'flex' : 'none';
        document.getElementById('fab-btn').style.display = workspace === 'notebook' ? 'block' : 'none';
        document.getElementById('coding-page').style.display = workspace === 'notebook' ? 'none' : 'block';
        const languageTabs = document.querySelector('.coding-language-tabs');
        if (languageTabs) languageTabs.style.display = workspace === 'web' ? 'flex' : 'none';
        document.getElementById('coding-output-page').style.display = 'none';
        document.body.classList.remove('terminal-open');
        document.getElementById('mode-switch').textContent = workspace === 'notebook' ? '📒 Notebook ▾' : (workspace === 'python' ? '🐍 Python ▾' : '🌐 HTML & CSS ▾');
        document.getElementById('top-run-btn').style.display = workspace === 'notebook' ? 'none' : 'inline-flex';
        if (!scriptEditor) {
            scriptEditor = CodeMirror.fromTextArea(document.getElementById('script-code'), {
                mode:'python', theme:document.body.classList.contains('night-mode') ? 'material-darker' : 'neo',
                lineNumbers:true, indentUnit:4, matchBrackets:true, viewportMargin:Infinity
            });
            scriptEditor.setSize('100%', 'auto');
            scriptEditor.on('focus', () => { lastFocusedEditor = scriptEditor; syncToolbar(); });
            scriptEditor.on('mousedown', () => { lastFocusedEditor = scriptEditor; });
            scriptEditor.on('keyup', () => { lastFocusedEditor = scriptEditor; });
        }
        if (workspace === 'web') {
            if (!webEditor) {
                webEditor = CodeMirror.fromTextArea(document.getElementById('web-code'), {
                    mode:'text/html', theme:document.body.classList.contains('night-mode') ? 'material-darker' : 'neo',
                    lineNumbers:true, indentUnit:2, matchBrackets:true, viewportMargin:Infinity
                });
                webEditor.on('focus', () => { lastFocusedEditor = webEditor; syncToolbar(); });
                webEditor.on('mousedown', () => { lastFocusedEditor = webEditor; });
                webEditor.on('keyup', () => { lastFocusedEditor = webEditor; });
            }
            selectCodingLanguage(codingLanguage === 'python' ? 'html' : codingLanguage);
        } else if (workspace === 'python') {
            codingLanguage = 'python';
            document.getElementById('script-editor').style.display = 'block';
            document.getElementById('web-editor').style.display = 'none';
        }
        if (scriptEditor) setTimeout(() => scriptEditor.refresh(), 80);
        if (webEditor) setTimeout(() => webEditor.refresh(), 80);
        window.scrollTo(0,0);
    }

    function toggleMode() {
        selectWorkspace(currentWorkspace === 'notebook' ? 'python' : 'notebook');
    }

    function showCodingOutputPage() {
        document.getElementById("coding-page").style.display = "none";
        document.getElementById("coding-output-page").style.display = "block";
        document.getElementById("coding-output-page").classList.remove("web-output");
        document.body.classList.add("terminal-open");
        document.getElementById("console-output").textContent = "";
        document.getElementById("console-input-row").style.display = "none";
        window.scrollTo(0, 0);
    }

    function backToCodingEditor() {
        const outputPage = document.getElementById("coding-output-page");
        if (!outputPage || getComputedStyle(outputPage).display === "none") return;
        outputPage.style.display = "none";
        document.getElementById("coding-output-page").classList.remove("web-output");
        if (codingLanguage === "html" && webEditor) savedHtmlCode = webEditor.getValue();
        if (codingLanguage === "css" && webEditor) savedCssCode = webEditor.getValue();
        document.body.classList.remove("terminal-open");
        document.getElementById("coding-page").style.display = "block";
        if (codingLanguage === 'python' && scriptEditor) lastFocusedEditor = scriptEditor;
        else if (webEditor) lastFocusedEditor = webEditor;
        if (scriptEditor) setTimeout(() => scriptEditor.refresh(), 80);
        if (webEditor) setTimeout(() => webEditor.refresh(), 80);
        syncToolbar();
        window.scrollTo(0, 0);
    }

    async function runScript() {
        if (currentWorkspace === 'notebook') selectWorkspace('python');
        if (!scriptEditor) selectWorkspace('python');
        if (currentWorkspace === 'web') {
            if (webEditor) {
                if (codingLanguage === "html") savedHtmlCode = webEditor.getValue();
                if (codingLanguage === "css") savedCssCode = webEditor.getValue();
            }
            showWebOutputPage();
            return;
        }
        if (currentWorkspace !== 'python') selectWorkspace('python');
        showCodingOutputPage();
        syncToolbar();
        const output = document.getElementById("console-output");
        const inputRow = document.getElementById("console-input-row");
        inputRow.style.display = "none";
        output.textContent = "";
        lastConsoleOutput = "";
        try {
            const res = await fetch('/code/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:scriptEditor.getValue()})});
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Could not start script");
            activeJobId = data.job_id;
            pollScriptStatus();
        } catch (e) { output.textContent = "Error: " + e.message; }
    }

    async function pollScriptStatus() {
        if (!activeJobId) return;
        try {
            const res = await fetch('/code/status/' + activeJobId);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Status request failed");
            const output = document.getElementById("console-output");
            if (data.output !== lastConsoleOutput) {
                output.textContent = data.output || "";
                lastConsoleOutput = data.output || "";
                const terminal = document.getElementById("console-terminal");
                terminal.scrollTop = terminal.scrollHeight;
            }
            const inputRow = document.getElementById("console-input-row");
            if (data.input_prompt !== null && data.input_prompt !== undefined) {
                inputRow.style.display = "flex";
                document.getElementById("console-prompt").textContent = data.input_prompt || "";
                const field = document.getElementById("console-input");
                if (document.activeElement !== field) {
                    field.removeAttribute("readonly");
                    setTimeout(() => { try { field.focus(); } catch (_) {} }, 80);
                }
                const terminal = document.getElementById("console-terminal");
                terminal.scrollTop = terminal.scrollHeight;
            } else if (!data.running) inputRow.style.display = "none";
            if (data.done) { activeJobId = null; return; }
            statusPollTimer = setTimeout(pollScriptStatus, 250);
        } catch (e) {
            document.getElementById("console-output").textContent += "\nStatus error: " + e.message;
            activeJobId = null;
        }
    }

    async function submitConsoleInput() {
        if (!activeJobId) return;
        const field = document.getElementById("console-input");
        const value = field.value;
        field.value = "";
        field.blur();
        document.getElementById("console-input-row").style.display = "none";
        try {
            const res = await fetch('/code/input/' + activeJobId, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({value})});
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Input could not be sent");
            if (statusPollTimer) clearTimeout(statusPollTimer);
            pollScriptStatus();
        } catch (e) { document.getElementById("console-output").textContent += "\nInput error: " + e.message; }
    }
    document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("console-input");
        if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") submitConsoleInput(); });
    });

    async function cancelScript() {
        if (!activeJobId) return;
        try { await fetch('/code/cancel/' + activeJobId, {method:'POST'}); } catch (_) {}
    }
    function clearConsole() {
        document.getElementById("console-output").textContent = "";
        lastConsoleOutput = "";
    }

    window.onload = () => {
        if (localStorage.getItem('theme') === 'night') document.body.classList.add('night-mode');
        addNewCell();
    }
</script>
</body>
</html>
