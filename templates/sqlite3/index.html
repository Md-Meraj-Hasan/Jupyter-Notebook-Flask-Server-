<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NiceCoding · SQLite3 Notebook</title>

<link rel="stylesheet" href="/sqlite3/assets/css/codemirror.min.css">
<link rel="stylesheet" href="/sqlite3/assets/css/material-darker.min.css">

<script src="/sqlite3/assets/js/codemirror.min.js"></script>
<script src="/sqlite3/assets/js/sql.min.js"></script>


<style>

html,body{
margin:2px;
height:100%;
overflow:hidden;
font-family:Consolas;
font-size:15px;
background:#ffffff;
}

.dark{
background:#1e1e1e;
color:white;
}

/* NOTEBOOK */
#notebook{
position:absolute;
top:0;
left:0;
right:0;
bottom:120px;
overflow-y:auto;
padding:10px;
box-sizing:border-box;
}

/* CELL */
.cell{
width:100%;
box-sizing:border-box;
border:1px solid #ccc;
margin-bottom:15px;
background:#fff;
}
.dark .cell{
background:#2b2b2b;
border:1px solid #555;
}

/* TOOLBAR */
.toolbar{
justify-content:flex-start;
display:flex;
align-items:center;
padding:3px 5px;
border-bottom:2px solid #2196F3;
background:#f7f7f7;
box-sizing:border-box;
width:100%;
}

.dark .toolbar{
background:#333;
border-bottom:2px solid #00e5ff;
}

.label{
flex:0 0 auto;
white-space:nowrap;
}

.dark .label{
color:#00e5ff;
}

.run-buttons{
display:flex;
gap:6px;
flex:0 0 auto;
}
.btn{
width:34px;
height:32px;
flex:0 0 auto;
}

.btn{
flex:0 0 auto;
width:38px;
height:34px;
border-radius:4px;
border:1px solid #ccc;
background:#f5f5f5;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:16px;
}
.dark .btn{
background:#424242;
border:1px solid #666;
color:white;
}

/* EDITOR */
.CodeMirror{
overflow:auto !important;
white-space:pre;
border-top:2px solid #2196F3;
border-bottom:2px solid #2196F3;
height:auto !important;
min-height:40px;
}
.dark .CodeMirror{
border-top:2px solid #00e5ff;
border-bottom:2px solid #00e5ff;
}


/* 🔥 Dark Mode SQL Bright Fix */
.cm-s-material-darker .cm-keyword{
color:#00e5ff !important;
font-weight:bold !important;
}
.cm-s-material-darker .cm-variable,
.cm-s-material-darker .cm-variable-2,
.cm-s-material-darker .cm-variable-3{
color:#ffffff !important;
}

/* OUTPUT */

.output{
display:none;
overflow-y:auto;
overflow-x:auto;
border-top:1px solid #ccc;
padding:4px 6px;
background:#fafafa;
box-sizing:border-box;
width:100%;
}

.output::-webkit-scrollbar{
height:6px;
}

.output table{
border-collapse:collapse;
width:max-content;     /* 🔥 important */
min-width:100%;
}

.output th,
.output td{
border:1px solid #999;
padding:6px 10px;
white-space:nowrap; 
}


.dark .output{
background:#1e1e1e;
}

.dark th{
background:#2b2b2b !important;
color:#ffffff !important;
font-weight:900 !important;
border:1px solid #777 !important;
}
.dark td{
border:1px solid #555 !important;
}

/* BOTTOM TOOLBAR */
.bottom-toolbar{
position:fixed;
left:0;
right:0;
bottom:0;
background:#111;
padding:8px 6px;
display:flex;
flex-direction:column;
gap:6px;
z-index:999999;
}
.bottom-row{
display:flex;
gap:6px;
}
.msg{
display:inline-block;
font-size:14px;
line-height:1;          /* 🔥 reduce height */
margin:0;               /* 🔥 remove extra gap */
padding:2px 6px;        /* minimal padding */
}

.key{
flex:1;
height:44px;
background:#2c2c2c;
color:white;
border:none;
border-radius:8px;
font-size:15px;
font-weight:bold;
}
.key.blue{background:#3949ab;}
.key.gray{background:#546e7a;}

</style>
</head>
<body>
<div style="padding:6px 8px;background:#f4f4f4;border-bottom:1px solid #ccc;font:14px sans-serif"><a href="/" style="text-decoration:none;color:#333;font-weight:bold">← Back to Main Notebook</a> <span style="margin-left:12px">SQLite3 Notebook · Separate workspace</span></div>

<div id="notebook"></div>

<div class="bottom-toolbar" id="bottomBar">

<div class="bottom-row">
<button class="key gray" onclick="insertText('\t')">TAB</button>
<button class="key gray" onclick="insertText('=')">=</button>
<button class="key blue" onclick="moveCursor('up')">▲</button>
<button class="key" onclick="insertText('_')">_</button>
<button class="key" onclick="insertPair('\'')">' '</button>
<button class="key" onclick="insertPair('\"')">" "</button>
<button class="key" onclick="insertPair('()')">( )</button>
<button class="key" onclick="insertPair('[]')">[ ]</button>
<button class="key" onclick="insertPair('{}')">{ }</button>
<button class="key" onclick="insertText(':')">:</button>
</div>

<div class="bottom-row">
<button class="key blue" onclick="moveCursor('left')">◀</button>
<button class="key blue" onclick="moveCursor('right')">▶</button>
<button class="key blue" onclick="moveCursor('down')">▼</button>
<button class="key" onclick="insertText('<')"><</button>
<button class="key" onclick="insertText('>')">></button>
<button class="key" onclick="insertText('+')">+</button>
<button class="key" onclick="insertText('*')">*</button>
<button class="key" onclick="insertText('/')">/</button>
<button class="key" onclick="insertText(';')">;</button>
</div>

</div>

<script>

let count=0
let activeEditor=null
let dark=false

function addCell() {
    count++; // Cell number badhane ke liye
    let cell = document.createElement("div");
    cell.className = "cell";

    cell.innerHTML = `
    <div class="toolbar">
        <span class="label">In [${count}]:</span>
        <div class="run-buttons">
            <button class="btn" onclick="runSQL(this)">▶</button>
            <button class="btn" onclick="toggleOutput(this)">👁️ </button>
            <button class="btn" onclick="deleteCell(this)">🗑 </button>
            <button class="btn" onclick="saveAll()">💾</button>
            <button class="btn" onclick="openFile()">📂</button>
            <button class="btn" onclick="toggleTheme()">🌙</button>
            <button class="btn" onclick="addCell()">+</button>
        </div>
    </div>
    <textarea></textarea>
    <div class="output"></div>
    `;

    document.getElementById("notebook").appendChild(cell);

    let ta = cell.querySelector("textarea");

    // Static folder se mode aur theme load karne ke liye update
    let editor = CodeMirror.fromTextArea(ta, {
        mode: "text/x-sql", // Ye static/js/sql.min.js use karega
        theme: dark ? "material-darker" : "default", // Ye static/css files use karega
        lineNumbers: false,
        viewportMargin: Infinity,
        lineWrapping: false,
        scrollbarStyle: "native"
    });

    editor.setSize(null, "auto");

    // Horizontal scrolling logic (Aapka original logic)
    editor.on("cursorActivity", function(cm) {
        let cursor = cm.getCursor();
        let coords = cm.cursorCoords(cursor, "local");
        let wrapper = cm.getWrapperElement();
        let scrollInfo = cm.getScrollInfo();

        if (coords.left < scrollInfo.left) {
            cm.scrollTo(coords.left - 20, scrollInfo.top);
        } else if (coords.right > scrollInfo.left + wrapper.clientWidth) {
            cm.scrollTo(coords.right - wrapper.clientWidth + 20, scrollInfo.top);
        }
        cm.scrollIntoView(cursor, 50);
    });

    editor.on("focus", () => activeEditor = editor);
    cell.editor = editor;
}


function saveAll(){
let cells=document.querySelectorAll(".cell")
let data=[]

cells.forEach(cell=>{
    data.push({
        query:cell.editor.getValue()
    })
})

let blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
)

let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="queries.json"
a.click()
}

function openFile(){
let input=document.createElement("input")
input.type="file"
input.accept=".json"

input.onchange=e=>{
let file=e.target.files[0]
if(!file) return

let reader=new FileReader()

reader.onload=function(event){
let data=JSON.parse(event.target.result)

document.getElementById("notebook").innerHTML=""
count=0

data.forEach(item=>{
addCell()
let last=document.querySelectorAll(".cell")
let cell=last[last.length-1]
cell.editor.setValue(item.query)
})
}

reader.readAsText(file)
}

input.click()
}

/* INSERT */
function insertText(text){
if(!activeEditor) return
activeEditor.replaceSelection(text)
activeEditor.focus()
}

function insertPair(pair){
if(!activeEditor) return
let open=pair[0]
let close=pair.length===2?pair[1]:pair[0]
activeEditor.replaceSelection(open+close)
let c=activeEditor.getCursor()
activeEditor.setCursor({line:c.line,ch:c.ch-1})
activeEditor.focus()
}

/* MOVE */
function moveCursor(dir){
if(!activeEditor) return
let c=activeEditor.getCursor()
if(dir==="left") c.ch--
if(dir==="right") c.ch++
if(dir==="up") c.line--
if(dir==="down") c.line++
activeEditor.setCursor(c)
activeEditor.focus()
}

function runSQL(btn){
    let cell = btn.closest(".cell")
    let code = cell.editor.getValue()
    let output = cell.querySelector(".output")

    output.style.display = "block"
    output.innerHTML = "Executing..."

    fetch("/run", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({code: code})
    })
    .then(res => res.json())
    .then(data => {
        output.innerHTML = ""

        if(data.output){
            output.innerHTML += "<span class='msg'>" + data.output + "</span>";
	}

        if(data.columns && data.rows){
            let table = "<table border='1' cellpadding='5'>"
            table += "<tr>"
            data.columns.forEach(col=>{
                table += "<th>" + col + "</th>"
            })
            table += "</tr>"

            data.rows.forEach(row=>{
                table += "<tr>"
                data.columns.forEach(col=>{
                    table += "<td>" + row[col] + "</td>"
                })
                table += "</tr>"
            })

            table += "</table>"
            output.innerHTML += table
        }
    })
    .catch(err=>{
        output.innerHTML = "Server not running"
    })
}

function toggleOutput(btn){
let cell=btn.closest(".cell")
let output=cell.querySelector(".output")
output.style.display=output.style.display==="none"?"block":"none"
}

function toggleTheme(){
dark=!dark
document.body.classList.toggle("dark")

document.querySelectorAll(".cell").forEach(cell=>{
    cell.editor.setOption(
        "theme",
        dark ? "material-darker" : "default"
    )
})
}

function deleteCell(btn){
    let notebook = document.getElementById("notebook")
    let cells = notebook.querySelectorAll(".cell")

    // Agar sirf 1 cell hai to delete mat karo
    if(cells.length <= 1){
        return
    }

    btn.closest(".cell").remove()
}

addCell()

/* KEYBOARD LOCK */
function lockToolbar(){
if(!window.visualViewport) return
const bar=document.getElementById("bottomBar")

function update(){
const viewport=window.visualViewport
const keyboardHeight=window.innerHeight-viewport.height-viewport.offsetTop
if(keyboardHeight>0){
bar.style.transform=`translateY(-${keyboardHeight}px)`
}else{
bar.style.transform=`translateY(0px)`
}
}

window.visualViewport.addEventListener("resize",update)
window.visualViewport.addEventListener("scroll",update)
update()
}

lockToolbar()

</script>
</body>
</html>
