<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Editor</title>
<style>
:root{--bg:#fff;--panel:#f5f6f8;--fg:#222;--border:#d2d5da}body.night{--bg:#1e1e1e;--panel:#2b2b2b;--fg:#eee;--border:#444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,Arial}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:var(--panel);border-bottom:1px solid var(--border)}header b{margin-right:auto}button,a{padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer;text-decoration:none}main{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.editors{display:grid;grid-template-rows:repeat(3,minmax(170px,1fr));gap:10px}.pane,.preview{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:170px}.pane h3,.preview h3{font-size:13px;margin:0;padding:8px;background:var(--panel);border-bottom:1px solid var(--border)}textarea{width:100%;height:100%;min-height:140px;resize:vertical;border:0;padding:10px;background:var(--bg);color:var(--fg);font:13px/1.5 Consolas,monospace;outline:none}.preview{min-height:750px}iframe{border:0;background:white;flex:1;width:100%;min-height:600px}@media(max-width:800px){main{grid-template-columns:1fr}.editors{min-height:850px}.preview{min-height:600px}}
</style></head><body><header><b>🧩 HTML + CSS + JavaScript</b><a href="/">← Notebook</a><button id="save">💾 Save all</button><button id="run">▶ Run preview</button><button id="theme">🌙 Theme</button><span id="status">Loading…</span></header>
<main><section class="editors"><div class="pane"><h3>📄 HTML · index.html</h3><textarea id="html"></textarea></div><div class="pane"><h3>🎨 CSS · style.css</h3><textarea id="css"></textarea></div><div class="pane"><h3>⚡ JavaScript · script.js</h3><textarea id="js"></textarea></div></section><section class="preview"><h3>👁️ Live preview</h3><iframe id="preview" sandbox="allow-scripts allow-forms"></iframe></section></main>
<script>
const e={html:document.getElementById('html'),css:document.getElementById('css'),js:document.getElementById('js')},status=document.getElementById('status');let loading=true,timer;
function render(){let h=e.html.value,c='<style>\n'+e.css.value+'\n</style>',j='<script>\n'+e.js.value+'\n<\\/script>';if(/<\\/head\\s*>/i.test(h))h=h.replace(/<\\/head\\s*>/i,c+'</head>');else h=c+h;if(/<\\/body\\s*>/i.test(h))h=h.replace(/<\\/body\\s*>/i,j+'</body>');else h+=j;document.getElementById('preview').srcdoc=h}
async function save(){try{let r=await fetch('/api/web-files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:e.html.value,css:e.css.value,js:e.js.value})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'save failed');status.textContent='Saved ✓'}catch(x){status.textContent='Save error';console.error(x)}}
function changed(){if(loading)return;status.textContent='Unsaved changes…';clearTimeout(timer);timer=setTimeout(save,650);render()}
Object.values(e).forEach(x=>x.addEventListener('input',changed));document.getElementById('save').onclick=save;document.getElementById('run').onclick=render;document.getElementById('theme').onclick=()=>document.body.classList.toggle('night');
async function load(){try{let r=await fetch('/api/web-files'),d=await r.json();if(d.ok){e.html.value=d.html;e.css.value=d.css;e.js.value=d.js;status.textContent='Loaded'}}catch(x){status.textContent='Load error'}loading=false;render()}
window.addEventListener('beforeunload',()=>{if(status.textContent==='Unsaved changes…')navigator.sendBeacon('/api/web-files',new Blob([JSON.stringify({html:e.html.value,css:e.css.value,js:e.js.value})],{type:'application/json'}))});load();
</script></body></html>
