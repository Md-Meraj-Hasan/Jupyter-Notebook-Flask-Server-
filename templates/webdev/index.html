<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NiceCoding · Web Development</title>
<style>
:root{--bg:#fff;--fg:#222;--panel:#f6f6f6;--border:#ccc;--accent:#2196f3}body.dark{--bg:#1e1e1e;--fg:#eee;--panel:#2d2d2d;--border:#555;--accent:#00bcd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px Arial,sans-serif}.top{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:9px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top a{color:var(--fg);text-decoration:none;font-weight:bold}button{padding:9px 12px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--fg);font-weight:bold;font-size:14px}.section{margin:8px;border:1px solid var(--border)}h3{margin:0;padding:10px;background:var(--panel);border-bottom:2px solid var(--accent)}textarea{display:block;width:100%;min-height:180px;resize:vertical;border:0;outline:none;padding:14px;font:15px/1.5 Consolas,monospace;white-space:pre;overflow:auto;background:var(--bg);color:var(--fg)}iframe{width:100%;height:300px;border:0;background:white}.hint{padding:8px;font-size:12px;opacity:.8}
</style></head><body><nav class="top"><a href="/">📓 Main Notebook</a><strong>🌐 HTML / CSS / JavaScript</strong><button onclick="runAll()">▶ Run All</button><button onclick="saveProject()">💾 Save project JSON</button><button onclick="openProject()">📂 Open project JSON</button><button onclick="document.body.classList.toggle('dark')">🌙 Theme</button></nav>
<section class="section"><h3>HTML</h3><textarea id="html" spellcheck="false"><main><h1>Hello NiceCoding!</h1><button onclick="hello()">Click me</button><p id="msg"></p></main></textarea></section>
<section class="section"><h3>CSS</h3><textarea id="css" spellcheck="false">body { font-family: sans-serif; padding: 20px; }
button { padding: 10px 16px; border-radius: 8px; }</textarea></section>
<section class="section"><h3>JavaScript</h3><textarea id="js" spellcheck="false">function hello() {
  document.getElementById('msg').textContent = 'JavaScript is working!';
}</textarea></section>
<section class="section"><h3>Live Preview</h3><iframe id="preview" sandbox="allow-scripts"></iframe><div class="hint">Preview is local/offline. JavaScript runs inside a sandboxed frame.</div></section>
<script>
function runAll(){const h=document.getElementById('html').value,c=document.getElementById('css').value,j=document.getElementById('js').value;const scriptOpen='<scr'+'ipt>';const scriptClose='</scr'+'ipt>';const safeCss=c.replace(/<\/style/gi,'<\\/style');const safeJs=j.replace(/<\/script/gi,'<\\/script');const doc='<!doctype html><html><head><meta charset="utf-8"><style>'+safeCss+'</style></head><body>'+h+scriptOpen+safeJs+scriptClose+'</body></html>';document.getElementById('preview').srcdoc=doc;}
function saveProject(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({html:html.value,css:css.value,js:js.value},null,2)],{type:'application/json'}));a.download='nicecoding-web-project.json';a.click();URL.revokeObjectURL(a.href)}
function openProject(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);html.value=d.html||'';css.value=d.css||'';js.value=d.js||'';runAll()}catch(e){alert('Invalid project JSON: '+e.message)}};r.readAsText(f)};i.click()}
window.addEventListener('load',runAll);
</script></body></html>
